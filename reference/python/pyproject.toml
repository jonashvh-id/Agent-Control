[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "agent-control"
version = "0.2.0"
description = "Standalone governance foundation for external AI agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5", "mcp==2.3.0", "httpx2>=2.13,<3", "cryptography>=46,<49"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx2>=2.13,<3", "ruff>=0.12,<1", "pytest-cov>=6,<8"]
[project.scripts]
agent-control = "backend.app.cli:main"
[tool.setuptools.packages.find]
include = ["backend*", "connectors*"]
exclude = ["backend.tests*"]
[tool.setuptools.package-data]
"backend.app.core.database" = ["schema.sql"]
"backend.app" = ["web/**/*"]
[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests/integration"]
pythonpath = ["."]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
